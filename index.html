<!DOCTYPE html>
  <html>
  <head>
    <title>Global Weather with Database</title>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
        transition: background 0.5s, color 0.5s;
        padding: 20px;
      }

      .main-container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        z-index: 2;
        position: relative;
        max-width: 1200px;
        width: 100%;
      }

      .container, .history-container, .forecast-container {
        background-color: rgba(255, 255, 255, 0.1);
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        width: 320px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
      }

      .history-container {
        width: 400px;
        max-height: 600px;
        overflow-y: auto;
      }

      .forecast-container {
        width: 400px;
        max-height: 600px;
        overflow-y: auto;
      }

      .time-display {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 15px;
        color: inherit;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      }

      input, button {
        padding: 10px;
        font-size: 16px;
        margin: 10px 0;
        width: 100%;
        border: none;
        border-radius: 5px;
      }

      button {
        background-color: #333;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #555;
      }

      .delete-btn {
        background-color: #e74c3c;
        padding: 5px 10px;
        font-size: 12px;
        width: auto;
        margin: 0 5px;
      }

      .delete-btn:hover {
        background-color: #c0392b;
      }

      .export-btn {
        background-color: #27ae60;
        margin-top: 10px;
      }

      .export-btn:hover {
        background-color: #229954;
      }

      #weather {
        font-size: 18px;
        margin-top: 15px;
      }

      .forecast-item {
        background-color: rgba(255, 255, 255, 0.1);
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        text-align: left;
        font-size: 13px;
        border-left: 4px solid #27ae60;
      }

      .forecast-item strong {
        display: block;
        margin-bottom: 5px;
        color: #fff;
      }

      .forecast-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .forecast-header h3 {
        margin: 0;
      }

      .history-item {
        background-color: rgba(255, 255, 255, 0.1);
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        text-align: left;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .history-item-content {
        flex: 1;
      }

      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .history-header h3 {
        margin: 0;
      }

      .clear-all-btn {
        background-color: #e67e22;
        padding: 8px 15px;
        font-size: 14px;
        width: auto;
        margin: 0;
      }

      .clear-all-btn:hover {
        background-color: #d35400;
      }

      .stats-container {
        background-color: rgba(255, 255, 255, 0.1);
        padding: 15px;
        margin-top: 20px;
        border-radius: 8px;
        text-align: left;
      }

      .stats-container h4 {
        margin-top: 0;
        text-align: center;
      }

      .stat-item {
        display: flex;
        justify-content: space-between;
        margin: 5px 0;
        font-size: 14px;
      }

      /* Weather themes */
      .sunny {
        background: linear-gradient(to top right, #fceabb, #f8b500);
        color: #333;
      }

      .cloudy {
        background: #2c3e50;
        color: #f0f0f0;
      }

      .spring {
        background: linear-gradient(45deg, #a8e6cf, #dcedc1);
        color: #2d5016;
      }

      .autumn {
        background: linear-gradient(45deg, #ff7e5f, #feb47b, #d2691e);
        color: #5d4037;
      }

      .dry {
        background: linear-gradient(to bottom, #d4a574, #f4e4bc);
        color: #8b4513;
      }

      .windy {
        background: linear-gradient(45deg, #74b9ff, #0984e3);
        color: #2d3436;
      }

      /* Sun animation */
      .sun {
        position: fixed;
        top: 50px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 100px;
        background: radial-gradient(circle, #fff700, #f8b500);
        border-radius: 50%;
        box-shadow: 0 0 30px #fff700;
        animation: pulseSun 3s ease-in-out infinite;
        z-index: 1;
      }

      @keyframes pulseSun {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(1.1); }
      }

      /* Cloud animation */
      .cloud {
        position: fixed;
        background: #fff;
        border-radius: 50%;
        opacity: 0.7;
        animation: floatClouds 40s linear infinite;
      }

      .cloud::before,
      .cloud::after {
        content: '';
        position: absolute;
        background: #fff;
        border-radius: 50%;
      }

      .cloud::before {
        width: 80px;
        height: 80px;
        top: -40px;
        left: 20px;
      }

      .cloud::after {
        width: 60px;
        height: 60px;
        top: -30px;
        left: 70px;
      }

      @keyframes floatClouds {
        0% { left: -300px; }
        100% { left: 100vw; }
      }

      /* Rain animation */
      .raindrop {
        position: fixed;
        width: 2px;
        height: 15px;
        background: #a3d0ff;
        animation: fall 1s linear infinite;
        z-index: 1;
      }

      @keyframes fall {
        0% { top: -20px; opacity: 0.7; }
        100% { top: 100vh; opacity: 0; }
      }

      /* Wind animation */
      .wind-line {
        position: fixed;
        height: 2px;
        background: rgba(255, 255, 255, 0.6);
        animation: windBlow 2s ease-in-out infinite;
        z-index: 1;
      }

      @keyframes windBlow {
        0% { left: -200px; opacity: 0; }
        50% { opacity: 1; }
        100% { left: 100vw; opacity: 0; }
      }

      /* Responsive design */
      @media (max-width: 768px) {
        .main-container {
          flex-direction: column;
          align-items: center;
        }
        
        .history-container {
          width: 320px;
        }

        .forecast-container {
          width: 320px;
        }
      }
    </style>
  </head>
  <body class="sunny">
    <div class="main-container">
      <div class="container">
        <div class="time-display" id="currentTime"></div>
        <h2>Check Weather</h2>
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button onclick="getWeather()">Get Weather</button>
        <p id="weather">Weather info will appear here</p>
        
        <div class="stats-container">
          <h4>Database Statistics</h4>
          <div class="stat-item">
            <span>Total Records:</span>
            <span id="totalRecords">0</span>
          </div>
          <div class="stat-item">
            <span>Avg Temperature:</span>
            <span id="avgTemp">--</span>
          </div>
          <div class="stat-item">
            <span>Cities Tracked:</span>
            <span id="citiesCount">0</span>
          </div>
        </div>
      </div>

      <div class="forecast-container">
        <div class="forecast-header">
          <h3>5-Day Forecast</h3>
        </div>
        <div id="forecastList">Forecast will appear here</div>
      </div>

      <div class="history-container">
        <div class="history-header">
          <h3>Weather History</h3>
          <button class="clear-all-btn" onclick="clearAllHistory()">Clear All</button>
        </div>
        <button class="export-btn" onclick="exportToCSV()">Export to CSV</button>
        <button class="export-btn" onclick="exportToJSON()">Export to JSON</button>
        <div id="historyList"></div>
      </div>

      <div class="history-container">
        <div class="history-header">
          <h3>Forecast History</h3>
        </div>
        <button class="export-btn" onclick="exportForecastToJSON()">Export Forecast to JSON</button>
        <div id="forecastHistoryList"></div>
      </div>
    </div>

    <script>
      const apiKey = 'b06626c66ac96e5beed6753894445b66';
      let db;

      // Initialize IndexedDB
      function initDB() {
        const request = indexedDB.open('WeatherDatabase', 2);

        request.onerror = function() {
          console.error('Database failed to open');
        };

        request.onsuccess = function() {
          db = request.result;
          console.log('Database opened successfully');
          loadHistory();
          loadForecastHistory();
          updateStats();
        };

        request.onupgradeneeded = function(e) {
          db = e.target.result;

          if (!db.objectStoreNames.contains('weather_records')) {
            const objectStore = db.createObjectStore('weather_records', { 
              keyPath: 'id', 
              autoIncrement: true 
            });

            objectStore.createIndex('city', 'city', { unique: false });
            objectStore.createIndex('timestamp', 'timestamp', { unique: false });
            objectStore.createIndex('temperature', 'temperature', { unique: false });
          }

          if (!db.objectStoreNames.contains('forecast_records')) {
            const forecastStore = db.createObjectStore('forecast_records', { 
              keyPath: 'id', 
              autoIncrement: true 
            });

            forecastStore.createIndex('city', 'city', { unique: false });
            forecastStore.createIndex('date', 'date', { unique: false });
          }
        };
      }

      // Save weather data to database
      function saveWeatherData(city, temperature, description, humidity, windSpeed) {
        const transaction = db.transaction(['weather_records'], 'readwrite');
        const objectStore = transaction.objectStore('weather_records');

        const weatherData = {
          city: city,
          temperature: temperature,
          description: description,
          humidity: humidity,
          windSpeed: windSpeed,
          timestamp: new Date().toISOString(),
          date: new Date().toLocaleDateString(),
          time: new Date().toLocaleTimeString()
        };

        const request = objectStore.add(weatherData);

        request.onsuccess = function() {
          console.log('Weather data saved successfully');
          loadHistory();
          updateStats();
        };

        request.onerror = function() {
          console.error('Error saving weather data');
        };
      }

      // Load weather history from database
      function loadHistory() {
        const transaction = db.transaction(['weather_records'], 'readonly');
        const objectStore = transaction.objectStore('weather_records');
        const request = objectStore.openCursor(null, 'prev'); // Load in reverse order (newest first)

        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';

        request.onsuccess = function(e) {
          const cursor = e.target.result;

          if (cursor) {
            const record = cursor.value;
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            historyItem.innerHTML = `
              <div class="history-item-content">
                <strong>${record.city}</strong><br>
                ${record.temperature}°C - ${record.description}<br>
                <small>${record.date} ${record.time}</small><br>
                <small>Humidity: ${record.humidity}% | Wind: ${record.windSpeed} m/s</small>
              </div>
              <button class="delete-btn" onclick="deleteRecord(${record.id})">Delete</button>
            `;
            historyList.appendChild(historyItem);
            cursor.continue();
          }
        };
      }

      // Delete a single record
      function deleteRecord(id) {
        const transaction = db.transaction(['weather_records'], 'readwrite');
        const objectStore = transaction.objectStore('weather_records');
        const request = objectStore.delete(id);

        request.onsuccess = function() {
          loadHistory();
          updateStats();
        };
      }

      // Clear all history
      function clearAllHistory() {
        if (confirm('Are you sure you want to clear all weather history?')) {
          const transaction = db.transaction(['weather_records'], 'readwrite');
          const objectStore = transaction.objectStore('weather_records');
          const request = objectStore.clear();

          request.onsuccess = function() {
            loadHistory();
            updateStats();
          };
        }
      }

      // Update statistics
      function updateStats() {
        const transaction = db.transaction(['weather_records'], 'readonly');
        const objectStore = transaction.objectStore('weather_records');
        const countRequest = objectStore.count();

        countRequest.onsuccess = function() {
          document.getElementById('totalRecords').textContent = countRequest.result;

          // Calculate average temperature and unique cities
          const getAllRequest = objectStore.getAll();
          getAllRequest.onsuccess = function() {
            const records = getAllRequest.result;
            
            if (records.length > 0) {
              const avgTemp = records.reduce((sum, record) => sum + record.temperature, 0) / records.length;
              document.getElementById('avgTemp').textContent = avgTemp.toFixed(1) + '°C';
              
              const uniqueCities = [...new Set(records.map(r => r.city))];
              document.getElementById('citiesCount').textContent = uniqueCities.length;
            } else {
              document.getElementById('avgTemp').textContent = '--';
              document.getElementById('citiesCount').textContent = '0';
            }
          };
        };
      }

      // Get 5-day weather forecast
      function getForecast(city) {
        fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric`)
          .then(res => res.json())
          .then(data => {
            if (data.cod === '200' || data.cod === 200) {
              const forecastList = document.getElementById('forecastList');
              forecastList.innerHTML = '';

              // Get forecast for every 24 hours (one entry per day)
              const dailyForecasts = {};
              data.list.forEach(forecast => {
                const date = new Date(forecast.dt * 1000).toLocaleDateString();
                if (!dailyForecasts[date]) {
                  dailyForecasts[date] = forecast;
                }
              });

              // Display up to 5 days
              Object.entries(dailyForecasts).slice(0, 5).forEach(([date, forecast]) => {
                const temp = forecast.main.temp;
                const desc = forecast.weather[0].description;
                const humidity = forecast.main.humidity;
                const windSpeed = forecast.wind?.speed || 0;

                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                  <strong>${date}</strong>
                  ${temp}°C - ${desc}<br>
                  <small>Humidity: ${humidity}% | Wind: ${windSpeed} m/s</small>
                `;
                forecastList.appendChild(forecastItem);

                // Save forecast to database
                saveForecastData(city, date, temp, desc, humidity, windSpeed);
              });
            } else {
              document.getElementById('forecastList').innerHTML = 'Forecast not available: ' + (data.message || 'Unknown error');
              console.error('Forecast API response:', data);
            }
          })
          .catch(err => {
            document.getElementById('forecastList').innerHTML = 'Error fetching forecast: ' + err.message;
            console.error('Forecast error:', err);
          });
      }

      // Save forecast data to database
      function saveForecastData(city, date, temperature, description, humidity, windSpeed) {
        const transaction = db.transaction(['forecast_records'], 'readwrite');
        const objectStore = transaction.objectStore('forecast_records');

        const forecastData = {
          city: city,
          date: date,
          temperature: temperature,
          description: description,
          humidity: humidity,
          windSpeed: windSpeed,
          timestamp: new Date().toISOString()
        };

        objectStore.add(forecastData);
      }

      // Load forecast history from database
      function loadForecastHistory() {
        const transaction = db.transaction(['forecast_records'], 'readonly');
        const objectStore = transaction.objectStore('forecast_records');
        const request = objectStore.openCursor(null, 'prev');

        const forecastHistoryList = document.getElementById('forecastHistoryList');
        if (!forecastHistoryList) return;
        
        forecastHistoryList.innerHTML = '';

        request.onsuccess = function(e) {
          const cursor = e.target.result;

          if (cursor) {
            const record = cursor.value;
            const forecastItem = document.createElement('div');
            forecastItem.className = 'history-item';
            forecastItem.innerHTML = `
              <div class="history-item-content">
                <strong>${record.city}</strong><br>
                ${record.temperature}°C - ${record.description}<br>
                <small>${record.date}</small><br>
                <small>Humidity: ${record.humidity}% | Wind: ${record.windSpeed} m/s</small>
              </div>
            `;
            forecastHistoryList.appendChild(forecastItem);
            cursor.continue();
          }
        };
      }

      // Export to CSV
      function exportToCSV() {
        const transaction = db.transaction(['weather_records'], 'readonly');
        const objectStore = transaction.objectStore('weather_records');
        const request = objectStore.getAll();

        request.onsuccess = function() {
          const records = request.result;
          if (records.length === 0) {
            alert('No data to export');
            return;
          }

          let csv = 'City,Temperature (°C),Description,Humidity (%),Wind Speed (m/s),Date,Time\n';
          records.forEach(record => {
            csv += `"${record.city}",${record.temperature},"${record.description}",${record.humidity},${record.windSpeed},"${record.date}","${record.time}"\n`;
          });

          downloadFile(csv, 'weather_history.csv', 'text/csv');
        };
      }

      // Export to JSON
      function exportToJSON() {
        const transaction = db.transaction(['weather_records'], 'readonly');
        const objectStore = transaction.objectStore('weather_records');
        const request = objectStore.getAll();

        request.onsuccess = function() {
          const records = request.result;
          if (records.length === 0) {
            alert('No data to export');
            return;
          }

          const json = JSON.stringify(records, null, 2);
          downloadFile(json, 'weather_history.json', 'application/json');
        };
      }

      // Export forecast to JSON
      function exportForecastToJSON() {
        const transaction = db.transaction(['forecast_records'], 'readonly');
        const objectStore = transaction.objectStore('forecast_records');
        const request = objectStore.getAll();

        request.onsuccess = function() {
          const records = request.result;
          if (records.length === 0) {
            alert('No forecast data to export');
            return;
          }

          const json = JSON.stringify(records, null, 2);
          downloadFile(json, 'weather_forecast_history.json', 'application/json');
        };
      }

      // Helper function to download files
      function downloadFile(content, filename, type) {
        const blob = new Blob([content], { type: type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // Update time every second
      function updateTime() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('en-US', {
          hour12: true,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        const dateString = now.toLocaleDateString('en-US', {
          weekday: 'short',
          month: 'short',
          day: 'numeric'
        });
        document.getElementById('currentTime').textContent = `${dateString} | ${timeString}`;
      }

      // Initialize time display
      updateTime();
      setInterval(updateTime, 1000);

      function clearAnimations() {
        document.querySelectorAll('.cloud, .sun, .raindrop, .wind-line, .leaf, .spring-leaf, .firefly, .dust, .flower').forEach(el => el.remove());
      }

      function createWindAnimation() {
        for (let i = 0; i < 10; i++) {
          const wind = document.createElement('div');
          wind.className = 'wind-line';
          wind.style.width = `${50 + Math.random() * 100}px`;
          wind.style.top = `${Math.random() * window.innerHeight}px`;
          wind.style.animationDelay = `${Math.random() * 2}s`;
          document.body.appendChild(wind);
        }
      }

      function getWeather() {
        const city = document.getElementById('cityInput').value;
        if (!city) return;

        fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`)
          .then(res => res.json())
          .then(data => {
            if (data.cod === 200) {
              const temp = data.main.temp;
              const desc = data.weather[0].description;
              const humidity = data.main.humidity;
              const windSpeed = data.wind?.speed || 0;
              
              document.getElementById('weather').innerHTML = `
                <strong>${city}</strong><br>
                ${temp}°C, ${desc}<br>
                Humidity: ${humidity}%<br>
                Wind: ${windSpeed} m/s
              `;

              // Save to database
              saveWeatherData(city, temp, desc, humidity, windSpeed);

              // Get forecast for the same city
              getForecast(city);

              const weatherType = desc.toLowerCase();
              const currentMonth = new Date().getMonth();
              clearAnimations();

              // Determine weather theme
              if (weatherType.includes('clear') && (currentMonth >= 2 && currentMonth <= 4)) {
                document.body.className = 'spring';
              } else if (weatherType.includes('clear') && (currentMonth >= 8 && currentMonth <= 10)) {
                document.body.className = 'autumn';
              } else if (windSpeed > 5 || weatherType.includes('wind')) {
                document.body.className = 'windy';
                createWindAnimation();
                const sun = document.createElement('div');
                sun.className = 'sun';
                document.body.appendChild(sun);
              } else if (humidity < 30 || weatherType.includes('dry') || weatherType.includes('desert')) {
                document.body.className = 'dry';
                const sun = document.createElement('div');
                sun.className = 'sun';
                document.body.appendChild(sun);
              } else if (weatherType.includes('cloud') || weatherType.includes('rain') || weatherType.includes('storm')) {
                document.body.className = 'cloudy';

                // Add clouds
                for (let i = 0; i < 5; i++) {
                  const cloud = document.createElement('div');
                  cloud.className = 'cloud';
                  cloud.style.width = `${120 + i * 20}px`;
                  cloud.style.height = `${70 + i * 10}px`;
                  cloud.style.top = `${50 + i * 40}px`;
                  cloud.style.animationDuration = `${30 + i * 10}s`;
                  document.body.appendChild(cloud);
                }

                // Add rain if applicable
                if (weatherType.includes('rain')) {
                  for (let i = 0; i < 100; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'raindrop';
                    drop.style.left = `${Math.random() * window.innerWidth}px`;
                    drop.style.animationDelay = `${Math.random()}s`;
                    document.body.appendChild(drop);
                  }
                }
              } else {
                // Default sunny
                document.body.className = 'sunny';
                const sun = document.createElement('div');
                sun.className = 'sun';
                document.body.appendChild(sun);
              }
            } else {
              document.getElementById('weather').textContent = `City not found`;
            }
          })
          .catch(err => {
            document.getElementById('weather').textContent = 'Error fetching weather';
            console.error(err);
          });
      }

      // Allow Enter key to trigger weather search
      document.getElementById('cityInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          getWeather();
        }
      });

      // Initialize database when page loads
      window.addEventListener('DOMContentLoaded', initDB);
    </script>
  </body>
  </html>
